[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 1000000
evm_version = "cancun"
bytecode_hash = "ipfs"
cbor_metadata = true
via_ir = false
auto_detect_remappings = false
auto_detect_solc = false
remappings = [
  "@forge-std/=lib/forge-std/src/",
]
